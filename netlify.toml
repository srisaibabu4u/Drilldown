# Netlify deployment config
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ / 22.12+
  NODE_VERSION = "22"

# Single-page app: serve index.html for any unknown path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
